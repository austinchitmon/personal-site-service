name: Backend Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # These exercise public files and protected monitoring. The older context-load
      # test requires a PostgreSQL instance and is not part of this job.
      - name: Test resume downloads, monitoring, and JWT authorization
        run: sh ./mvnw -B '-Dtest=Resume*Test,Homelab*Test,DatabaseHealthProbeTest' test
      - name: Test collector sanitization and failure handling
        run: python3 -m unittest discover -s monitoring/tests -v
