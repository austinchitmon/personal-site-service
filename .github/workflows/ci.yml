name: Resume Download Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  resume-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # These exercise the file endpoint in isolation. The older context-load
      # test requires a PostgreSQL instance and is not part of this job.
      - name: Test PDF responses, live file replacement, and failure logging
        run: sh ./mvnw -B '-Dtest=Resume*Test' test
