services:
  personal-site-service:
    # image is used as-is on the homelab VM (`docker compose pull`); local dev can
    # still run `docker compose up --build` to build from the Dockerfile instead.
    image: ghcr.io/austinchitmon/personal-site-service:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      # Set to "local" to enable CORS for an Angular dev server on localhost:4200.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
